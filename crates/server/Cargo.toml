[package]
name = "server"
description = "smart-review server: HTTP API, SSE, GitHub integration, pipeline and job queue."
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "smart-review-server"
path = "src/main.rs"

[features]
# Serve the built web UI (web/dist) from the binary; off in development and test builds.
embed-ui = ["dep:rust-embed", "dep:mime_guess"]

[dependencies]
contracts.workspace = true
analysis.workspace = true
db.workspace = true
axum.workspace = true
base64.workspace = true
dotenvy.workspace = true
ipnet.workspace = true
mime_guess = { workspace = true, optional = true }
rust-embed = { workspace = true, optional = true }
secrecy.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["macros", "net", "rt-multi-thread", "signal"] }
tracing.workspace = true
tracing-subscriber.workspace = true
url.workspace = true

[dev-dependencies]
tower.workspace = true

[lints]
workspace = true
