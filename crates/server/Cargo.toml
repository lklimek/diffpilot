[package]
name = "server"
description = "diffpilot server: HTTP API, SSE, GitHub integration, pipeline and job queue."
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "diffpilot-server"
path = "src/main.rs"

[features]
# Serve the built web UI (web/dist) from the binary; off in development and test builds.
embed-ui = ["dep:rust-embed", "dep:mime_guess"]

[dependencies]
aes-gcm.workspace = true
getrandom.workspace = true
jiff.workspace = true
reqwest = { workspace = true, features = ["form"] }
serde.workspace = true
sha2.workspace = true
subtle.workspace = true
uuid.workspace = true
contracts.workspace = true
analysis.workspace = true
db.workspace = true
axum.workspace = true
base64.workspace = true
dotenvy.workspace = true
futures.workspace = true
ipnet.workspace = true
jsonschema.workspace = true
jsonwebtoken.workspace = true
rmcp.workspace = true
mime_guess = { workspace = true, optional = true }
rust-embed = { workspace = true, optional = true }
secrecy.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tracing.workspace = true
tracing-subscriber.workspace = true
url.workspace = true

[dev-dependencies]
aws-lc-rs.workspace = true
db = { workspace = true, features = ["test-util"] }
# Dashboard scan tests run the real client against the fake in-process (check-architecture.sh A1 exception).
fake-github = { path = "../../tools/fake-github" }
wiremock.workspace = true
http-body-util.workspace = true
proptest.workspace = true
regex.workspace = true
# The fake MemCan of the tests is a real MCP server.
rmcp = { workspace = true, features = ["server", "transport-streamable-http-server"] }
serde.workspace = true
tempfile.workspace = true
# Paused time for the SSE heartbeat cadence.
tokio = { workspace = true, features = ["test-util"] }
tower.workspace = true

[lints]
workspace = true
