[package]
name = "server"
description = "smart-review server: HTTP API, SSE, GitHub integration, pipeline and job queue."
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "smart-review-server"
path = "src/main.rs"

[features]
# Serve the built web UI (web/dist) from the binary; off in development and test builds.
embed-ui = ["dep:rust-embed", "dep:mime_guess"]

[dependencies]
aes-gcm.workspace = true
reqwest = { workspace = true, features = ["form"] }
serde.workspace = true
uuid.workspace = true
contracts.workspace = true
analysis.workspace = true
db.workspace = true
axum.workspace = true
base64.workspace = true
chrono.workspace = true
dotenvy.workspace = true
futures.workspace = true
getrandom.workspace = true
ipnet.workspace = true
mime_guess = { workspace = true, optional = true }
rust-embed = { workspace = true, optional = true }
secrecy.workspace = true
serde_json.workspace = true
sha2.workspace = true
subtle.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tracing.workspace = true
tracing-subscriber.workspace = true
url.workspace = true

[dev-dependencies]
db = { workspace = true, features = ["test-util"] }
wiremock.workspace = true
http-body-util.workspace = true
serde.workspace = true
tower.workspace = true

[lints]
workspace = true
