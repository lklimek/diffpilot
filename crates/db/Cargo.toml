[package]
name = "db"
description = "diffpilot database module: SQLite schema and repository API."
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[features]
# Seed helpers for tests of dependent crates (`repo::analyses::testing`); never enabled in release builds.
test-util = []

[dependencies]
uuid.workspace = true
contracts.workspace = true
jiff.workspace = true
serde.workspace = true
serde_json.workspace = true
sqlx.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["sync"] }
tracing.workspace = true

[dev-dependencies]
# The host's zone, as SQLite's `localtime` uses it.
jiff = { workspace = true, features = ["tz-system"] }
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread", "time"] }

[lints]
workspace = true
