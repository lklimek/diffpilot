[package]
name = "runner"
description = "smart-review job runner: executes agent jobs claimed from the server."
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "smart-review-runner"
path = "src/main.rs"

[[bin]]
name = "smart-review-supervisor"
path = "src/supervisor_main.rs"

[features]
# Scripted LLM provider for tests and development; never enabled in release builds.
fake-provider = []

[dependencies]
contracts.workspace = true
chrono.workspace = true
futures.workspace = true
reqwest.workspace = true
rustix = { workspace = true, features = ["net"] }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
tempfile.workspace = true
uuid.workspace = true
wiremock.workspace = true

[lints]
workspace = true
