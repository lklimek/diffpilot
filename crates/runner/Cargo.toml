[package]
name = "runner"
description = "smart-review job runner: executes agent jobs claimed from the server."
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "smart-review-runner"
path = "src/main.rs"

[features]
# Scripted LLM provider for tests and development; never enabled in release builds.
fake-provider = []

[dependencies]
contracts.workspace = true
chrono.workspace = true
futures.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["sync"] }

[lints]
workspace = true
