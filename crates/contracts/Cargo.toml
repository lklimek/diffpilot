[package]
name = "contracts"
description = "smart-review wire types: agent output, HTTP API, SSE events, runner protocol. Pure data, no IO."
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
chrono.workspace = true
# preserve_order: schema property order = field order = the order the model generates (ADR-009).
schemars = { workspace = true, features = ["preserve_order", "chrono04", "uuid1"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
ts-rs = { workspace = true, features = ["chrono-impl", "uuid-impl"] }
uuid.workspace = true

[dev-dependencies]
jsonschema.workspace = true

[lints]
workspace = true
