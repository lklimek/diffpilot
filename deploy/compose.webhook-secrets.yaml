# Optional GitHub App webhook secret files. Set the matching SR_GITHUB_WEBHOOK_SECRET[_PREVIOUS]_FILE in .env.
# Keep the corresponding inline secrets unset. See docs/deployment.md.
services:
  server:
    volumes:
      - type: bind
        source: ${SR_SECRETS_DIR:-/srv/diffpilot/secrets}/github-webhook
        target: /run/secrets/github-webhook
        read_only: true
        bind: { create_host_path: false }
