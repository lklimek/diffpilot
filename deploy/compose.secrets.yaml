# Secrets as files (ADR-001, threat model AR-7), on top of deploy/compose.yaml: the server and the runner read
# SR_SECRET_KEY, SR_RUNNER_SECRET, SR_GITHUB_CLIENT_SECRET, SR_GITHUB_WEBHOOK_SECRET and SR_MEMCAN_TOKEN
# from read-only files in SR_SECRETS_DIR. Leave their environment values empty in .env.
# For rotation, set SR_GITHUB_WEBHOOK_SECRET_PREVIOUS_FILE to /run/secrets/github-webhook/previous.
#   docker compose --env-file .env -f deploy/compose.yaml -f deploy/compose.secrets.yaml up -d
# sr-runner-secret is shared: owner 10002, group 10010, mode 0440; all other files 10010:10010 0400.
# Files, owners and modes: docs/runbook.md, "Secrets as files".
x-secret: &secret
  type: bind
  read_only: true
  bind: { create_host_path: false }

services:
  server:
    environment:
      SR_SECRET_KEY: !reset null
      SR_RUNNER_SECRET: !reset null
      SR_GITHUB_CLIENT_SECRET: !reset null
      SR_GITHUB_WEBHOOK_SECRET: !reset null
      SR_MEMCAN_TOKEN: !reset null
      SR_SECRET_KEY_FILE: /run/secrets/sr-secret-key
      SR_RUNNER_SECRET_FILE: /run/secrets/sr-runner-secret
      SR_GITHUB_CLIENT_SECRET_FILE: /run/secrets/sr-github-client-secret
      SR_GITHUB_WEBHOOK_SECRET_FILE: /run/secrets/github-webhook/current
      SR_MEMCAN_TOKEN_FILE: /run/secrets/sr-memcan-token
    volumes:
      - { <<: *secret, source: "${SR_SECRETS_DIR:-/srv/diffpilot/secrets}/sr-secret-key", target: /run/secrets/sr-secret-key }
      - { <<: *secret, source: "${SR_SECRETS_DIR:-/srv/diffpilot/secrets}/sr-runner-secret", target: /run/secrets/sr-runner-secret }
      - { <<: *secret, source: "${SR_SECRETS_DIR:-/srv/diffpilot/secrets}/sr-github-client-secret", target: /run/secrets/sr-github-client-secret }
      - { <<: *secret, source: "${SR_SECRETS_DIR:-/srv/diffpilot/secrets}/github-webhook", target: /run/secrets/github-webhook }
      - { <<: *secret, source: "${SR_SECRETS_DIR:-/srv/diffpilot/secrets}/sr-memcan-token", target: /run/secrets/sr-memcan-token }

  runner:
    environment:
      SR_RUNNER_SECRET: !reset null
      SR_RUNNER_SECRET_FILE: /run/secrets/sr-runner-secret
    volumes:
      - { <<: *secret, source: "${SR_SECRETS_DIR:-/srv/diffpilot/secrets}/sr-runner-secret", target: /run/secrets/sr-runner-secret }
