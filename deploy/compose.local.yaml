# Local test variant of deploy/compose.yaml on http://localhost (never on the production host):
#   docker compose --env-file .env -f deploy/compose.yaml -f deploy/compose.local.yaml up -d
# with SR_PUBLIC_URL=http://localhost:<SR_HTTP_PORT> in that .env. The only difference: published on loopback only.
# Container isolation, runtime state and caches use the production configuration.
services:
  server:
    ports: !override
      - "127.0.0.1:${SR_HTTP_PORT:-3000}:3000"
