# Container runtime: server, runner, launcher, plan gateway and worker-only egress proxy.
# The launcher alone holds the engine socket. Worker/fetch images must be pinned by digest.
name: diffpilot

x-temporary-volume: &temporary-volume
  labels: { diffpilot.volume: temporary }

x-hardening: &hardening
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  read_only: true
  init: true
  restart: unless-stopped
  logging:
    driver: local
    options: { max-size: "10m", max-file: "5" }

services:
  server:
    <<: *hardening
    image: ${SR_SERVER_IMAGE:-diffpilot-server:local}
    build:
      context: ..
      dockerfile: deploy/server/Dockerfile
    environment:
      SR_PUBLIC_URL: ${SR_PUBLIC_URL:?set SR_PUBLIC_URL}
      SR_ALLOWED_LOGINS: ${SR_ALLOWED_LOGINS:?set SR_ALLOWED_LOGINS}
      SR_LISTEN_ADDR: ${SR_SERVER_PUBLIC_ADDR:-172.29.73.2}:3000
      SR_RUNNER_LISTEN_ADDR: ${SR_SERVER_RUNNER_ADDR:-172.29.71.2}:3001
      SR_GATEWAY_ADMIN_URL: http://${SR_GATEWAY_ADMIN_ADDR:-172.29.71.5}:8091
      SR_GATEWAY_CREDENTIALS_TOKEN_FILE: /run/secrets/gateway-credentials-token
      SR_TRUSTED_PROXIES: ${SR_TRUSTED_PROXIES:-}
      SR_DATA_DIR: /var/lib/diffpilot
      # Secrets from .env, or empty there and read from files (compose.secrets.yaml); a missing one stops the
      # service at start, and check-production-config.sh --env-file reports it before.
      SR_SECRET_KEY: ${SR_SECRET_KEY:-}
      SR_RUNNER_SECRET: ${SR_RUNNER_SECRET:-}
      SR_GITHUB_APP_ID: ${SR_GITHUB_APP_ID:?set SR_GITHUB_APP_ID}
      SR_GITHUB_CLIENT_ID: ${SR_GITHUB_CLIENT_ID:?set SR_GITHUB_CLIENT_ID}
      SR_GITHUB_CLIENT_SECRET: ${SR_GITHUB_CLIENT_SECRET:-}
      SR_GITHUB_APP_PRIVATE_KEY_FILE: /run/secrets/github-app.pem
      SR_GITHUB_API_URL: ${SR_GITHUB_API_URL:-https://api.github.com}
      SR_GITHUB_OAUTH_URL: ${SR_GITHUB_OAUTH_URL:-https://github.com}
      SR_GITHUB_CLONE_URL: ${SR_GITHUB_CLONE_URL:-https://github.com}
      SR_MEMCAN_URL: ${SR_MEMCAN_URL:?set SR_MEMCAN_URL}
      SR_MEMCAN_TOKEN: ${SR_MEMCAN_TOKEN:-}
      SR_MEMCAN_UI_URL: ${SR_MEMCAN_UI_URL:-}
      SR_PR_HYGIENE_URL: ${SR_PR_HYGIENE_URL:-}
      SR_THEPASTACLAW_STATUS_URL: ${SR_THEPASTACLAW_STATUS_URL:-}
      SR_NOTIFY_DENY_PRIVATE: ${SR_NOTIFY_DENY_PRIVATE:-0}
      RUST_LOG: ${RUST_LOG:-info}
      NO_COLOR: "1"
    volumes:
      - server-data:/var/lib/diffpilot
      - type: bind
        source: ${SR_GATEWAY_CREDENTIALS_TOKEN_PATH:-/srv/diffpilot/secrets/gateway-credentials-token}
        target: /run/secrets/gateway-credentials-token
        read_only: true
        bind: { create_host_path: false }
      # The App key stays on the host, read-only (never copied into an image or volume).
      - type: bind
        source: ${SR_GITHUB_APP_PRIVATE_KEY_PATH:?set SR_GITHUB_APP_PRIVATE_KEY_PATH}
        target: /run/secrets/github-app.pem
        read_only: true
        bind: { create_host_path: false }
      - tmp-server:/tmp
    mem_limit: ${SR_SERVER_MEM_LIMIT:-2g}
    cpus: ${SR_SERVER_CPUS:-2}
    pids_limit: 512
    logging:
      # Up to 500 MB of server history (rotated files compressed), "analysis statistics" lines included; lost when
      # the container is re-created, so export them first (runbook, "Logs").
      driver: local
      options: { max-size: "50m", max-file: "10" }
    ports:
      # Only to the reverse proxy: loopback by default (owner's proxy on this host), or SR_PUBLISH_ADDR.
      - "${SR_PUBLISH_ADDR:-127.0.0.1}:${SR_HTTP_PORT:-3000}:3000"
    networks:
      public: { ipv4_address: "${SR_SERVER_PUBLIC_ADDR:-172.29.73.2}" }
      runner: { ipv4_address: "${SR_SERVER_RUNNER_ADDR:-172.29.71.2}" }

  runner:
    <<: *hardening
    image: ${SR_RUNNER_IMAGE:-diffpilot-runner:local}
    build: { context: .., dockerfile: deploy/containers/runner.Dockerfile }
    user: "10002:10002"
    ipc: none
    pids_limit: 128
    cpus: ${SR_RUNNER_CPUS:-2}
    mem_limit: ${SR_RUNNER_MEM_LIMIT:-1g}
    stop_grace_period: 60s
    environment:
      SR_RUNNER_SERVER_URL: http://${SR_SERVER_RUNNER_ADDR:-172.29.71.2}:3001
      SR_RUNNER_SECRET: ${SR_RUNNER_SECRET:-}
      SR_RUNNER_ID: ${SR_RUNNER_ID:-runner}
      SR_RUNNER_MIRRORS_DIR: /mirror
      SR_RUNNER_DISK_RESERVE_MIB: ${SR_RUNNER_DISK_RESERVE_MIB:-2048}
      SR_LAUNCHER_SOCKET: /run/launcher/launcher.sock
      SR_GATEWAY_ADMIN_URL: http://${SR_GATEWAY_ADMIN_ADDR:-172.29.71.5}:8091
      SR_GATEWAY_KEYS_TOKEN_FILE: /run/secrets/gateway-keys-token
      SR_WORKER_SKILLS_COMMIT: ${SR_WORKER_SKILLS_COMMIT:-71096d7d4481977added8761b2cfd63cd84852b4}
      HTTPS_PROXY: http://${SR_PROXY_RUNNER_ADDR:-172.29.71.3}:3128
      NO_PROXY: localhost,127.0.0.1,${SR_SERVER_RUNNER_ADDR:-172.29.71.2}
      RUST_LOG: ${RUST_LOG:-info}
    volumes:
      - runtime-state:/var/lib/diffpilot-runner
      - c1:/mirror
      - launcher-socket:/run/launcher
      - type: bind
        source: ${SR_RUNNER_GATEWAY_KEYS_TOKEN_PATH:-/srv/diffpilot/secrets/runner-gateway-keys-token}
        target: /run/secrets/gateway-keys-token
        read_only: true
        bind: { create_host_path: false }
    tmpfs: ["/tmp:uid=10002,gid=10002,mode=0700,size=64m"]
    healthcheck:
      test: [CMD-SHELL, "test ! -e /var/lib/diffpilot-runner/disk-below-reserve"]
      interval: 30s
      timeout: 5s
    depends_on:
      server: { condition: service_healthy }
      launcher: { condition: service_started }
      codex-gateway: { condition: service_started }
      egress-proxy: { condition: service_healthy }
    networks:
      runner: { ipv4_address: "${SR_RUNNER_ADDR:-172.29.71.4}" }

  launcher:
    <<: *hardening
    image: ${SR_RUNNER_IMAGE:-diffpilot-runner:local}
    command: [--launcher]
    network_mode: none
    group_add: ["${SR_DOCKER_GID:-0}"]
    environment:
      SR_LAUNCHER_SOCKET: /run/launcher/launcher.sock
      SR_CONTAINER_PREFIX: ${COMPOSE_PROJECT_NAME:-diffpilot}
      SR_WORKER_IMAGE: ${SR_WORKER_IMAGE:?set digest-pinned worker image}
      SR_FETCH_IMAGE: ${SR_FETCH_IMAGE:?set digest-pinned fetch image}
      SR_WORKER_NETWORK: ${COMPOSE_PROJECT_NAME:-diffpilot}-worker
      SR_JUDGE_NETWORK: ${COMPOSE_PROJECT_NAME:-diffpilot}-judge
      SR_WORKER_PROXY: http://egress-proxy:3128
      SR_WORKER_MEMORY: ${SR_WORKER_MEMORY:-2147483648}
      SR_WORKER_CPUS: ${SR_WORKER_CPUS:-2}
      SR_WORKER_PIDS: ${SR_WORKER_PIDS:-1024}
      SR_WORKER_MAX_RUNNING: ${SR_WORKER_MAX_RUNNING:-3}
      SR_WORKER_IDLE_STOP: ${SR_WORKER_IDLE_STOP:-1200}
    volumes:
      - launcher-socket:/run/launcher
      - /var/run/docker.sock:/var/run/docker.sock
    tmpfs: ["/tmp:uid=10002,gid=10002,mode=0700,size=16m"]
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 64

  codex-gateway:
    <<: *hardening
    image: ${SR_SERVER_IMAGE:-diffpilot-server:local}
    entrypoint: [/usr/local/bin/diffpilot-gateway]
    user: "10010:10010"
    healthcheck: { disable: true }
    stop_grace_period: 55s
    environment:
      SR_GATEWAY_MODEL_ADDR: ${SR_GATEWAY_MODEL_ADDR:-172.29.75.2}:8090
      SR_GATEWAY_JUDGE_ADDR: ${SR_GATEWAY_JUDGE_ADDR:-172.29.76.2}:8090
      SR_GATEWAY_ADMIN_ADDR: ${SR_GATEWAY_ADMIN_ADDR:-172.29.71.5}:8091
      SR_GATEWAY_STORE: /var/lib/diffpilot-gateway
      SR_GATEWAY_SECRET_KEY_FILE: /run/secrets/gateway-secret-key
      SR_GATEWAY_CREDENTIALS_TOKEN_FILE: /run/secrets/gateway-credentials-token
      SR_GATEWAY_KEYS_TOKEN_FILE: /run/secrets/gateway-keys-token
    volumes:
      - gateway-data:/var/lib/diffpilot-gateway
      - type: bind
        source: ${SR_GATEWAY_SECRET_KEY_PATH:-/srv/diffpilot/secrets/gateway-secret-key}
        target: /run/secrets/gateway-secret-key
        read_only: true
        bind: { create_host_path: false }
      - type: bind
        source: ${SR_GATEWAY_CREDENTIALS_TOKEN_PATH:-/srv/diffpilot/secrets/gateway-credentials-token}
        target: /run/secrets/gateway-credentials-token
        read_only: true
        bind: { create_host_path: false }
      - type: bind
        source: ${SR_GATEWAY_KEYS_TOKEN_PATH:-/srv/diffpilot/secrets/gateway-keys-token}
        target: /run/secrets/gateway-keys-token
        read_only: true
        bind: { create_host_path: false }
    tmpfs: ["/tmp:uid=10010,gid=10010,mode=0700,size=16m"]
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 64
    networks:
      runner: { ipv4_address: "${SR_GATEWAY_ADMIN_ADDR:-172.29.71.5}" }
      worker: { ipv4_address: "${SR_GATEWAY_MODEL_ADDR:-172.29.75.2}" }
      judge: { ipv4_address: "${SR_GATEWAY_JUDGE_ADDR:-172.29.76.2}" }
      egress: {}

  egress-proxy:
    <<: *hardening
    image: ${SR_PROXY_IMAGE:-diffpilot-egress-proxy:local}
    build: { context: egress-proxy, additional_contexts: { workspace: .. } }
    # Kept in RAM on purpose: under 1 KB of configuration the entrypoint writes at every start (hosts file, MemCan
    # rule); nothing else is stored.
    tmpfs: ["/run/squid:uid=13,gid=13,mode=0750,size=1m"]
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 128
    environment:
      # MemCan exception of the SSRF guard: this host:port only (T4, S6 finding 4).
      SR_MEMCAN_URL: ${SR_MEMCAN_URL:?set SR_MEMCAN_URL}
    logging:
      # T9/T4b: host-name log, retention by size (about 5 x 50 MB); access restricted to Docker operators.
      driver: local
      options: { max-size: "50m", max-file: "5" }
    networks:
      runner: { ipv4_address: "${SR_PROXY_RUNNER_ADDR:-172.29.71.3}" }
      worker: {}
      egress: { ipv4_address: "${SR_PROXY_EGRESS_ADDR:-172.29.72.2}" }

volumes:
  server-data: {}
  runtime-state: {}
  launcher-socket: {}
  gateway-data: {}
  c1: { name: "${COMPOSE_PROJECT_NAME:-diffpilot}-c1" }
  # Disposable scratch, never backed up (docs/runbook.md, "Temporary volumes").
  tmp-server: *temporary-volume

networks:
  public:
    ipam: { config: [{ subnet: "${SR_PUBLIC_SUBNET:-172.29.73.0/24}" }] }
  runner:
    internal: true
    driver_opts:
      com.docker.network.bridge.gateway_mode_ipv4: isolated
      com.docker.network.bridge.gateway_mode_ipv6: isolated
    ipam: { config: [{ subnet: "${SR_RUNNER_SUBNET:-172.29.71.0/24}" }] }
  egress:
    ipam: { config: [{ subnet: "${SR_EGRESS_SUBNET:-172.29.72.0/24}" }] }
  worker:
    name: ${COMPOSE_PROJECT_NAME:-diffpilot}-worker
    internal: true
    driver_opts:
      com.docker.network.bridge.gateway_mode_ipv4: isolated
      com.docker.network.bridge.gateway_mode_ipv6: isolated
    ipam: { config: [{ subnet: "${SR_WORKER_SUBNET:-172.29.75.0/24}" }] }
  judge:
    name: ${COMPOSE_PROJECT_NAME:-diffpilot}-judge
    internal: true
    driver_opts:
      com.docker.network.bridge.gateway_mode_ipv4: isolated
      com.docker.network.bridge.gateway_mode_ipv6: isolated
    ipam: { config: [{ subnet: "${SR_JUDGE_SUBNET:-172.29.76.0/24}" }] }
