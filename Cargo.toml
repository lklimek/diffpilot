[workspace]
resolver = "3"
members = ["crates/*", "tools/*"]

[workspace.package]
edition = "2024"
rust-version = "1.99"
publish = false

[workspace.dependencies]
# Workspace crates (dependency direction: docs/implementation-plan.md §3, scripts/check-architecture.sh)
contracts = { path = "crates/contracts" }
analysis = { path = "crates/analysis" }
db = { path = "crates/db" }

# Runtime, errors, logging, configuration
tokio = "1.54.1"
futures = "0.3.34"
thiserror = "2.0.21"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
clap = { version = "4.6.7", features = ["derive", "env"] }
dotenvy = "0.15.7"
secrecy = "0.10.3"
url = { version = "2.5.8", features = ["serde"] }
ipnet = "2.12.2"
chrono = { version = "0.4.45", default-features = false, features = ["std", "clock", "serde"] }
# IANA time zones of the dashboard settings and schedule (plan §A.5).
chrono-tz = "0.10.4"
uuid = { version = "1.29.2", features = ["v4", "serde"] }
base64 = "0.23.1"
# Runner: process-group signals and O_NOFOLLOW opens without unsafe code.
rustix = { version = "1.1.6", features = ["fs", "process"] }

# Serialisation and contracts
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
schemars = "1.2.3"
ts-rs = "12.0.1"
# Local schemas only: no remote $ref resolution.
jsonschema = { version = "0.61.2", default-features = false }

# HTTP server and clients
axum = "0.8.9"
tower-http = "0.7.1"
reqwest = { version = "0.13.5", features = ["json"] }
octocrab = "0.54.9"
# GitHub App JWT (RS256); aws-lc-rs is the crypto backend rustls already uses.
jsonwebtoken = { version = "12.0.0", default-features = false, features = ["aws_lc_rs", "use_pem"] }
# Client only (MemCan); `reqwest` adds rustls for https endpoints.
rmcp = { version = "3.10.0", default-features = false, features = ["client", "transport-streamable-http-client-reqwest", "reqwest"] }
rust-embed = "8.14.0"
mime_guess = "2.0.5"

# Database: runtime queries only, no query macros (ADR-001)
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "derive"] }

# Secrets, diffs
aes-gcm = "0.11.1"
sha2 = "0.11.1"
getrandom = "0.4.3"
subtle = "2.6.1"
similar = "3.2.1"
ra-ap-rustc_lexer = "0.185.0"
regex = "1.13.1"
toml_edit = { version = "0.25.19", default-features = false, features = ["parse"] }

# Tests
tower = { version = "0.5.3", features = ["util"] }
http-body-util = "0.1.5"
wiremock = "0.6.5"
proptest = "1.12.0"
insta = { version = "1.49.0", features = ["json"] }
tempfile = "3.27.0"
# Throwaway RSA keys in tests.
aws-lc-rs = "1.19.0"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
