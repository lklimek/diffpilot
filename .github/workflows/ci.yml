name: CI

on:
  push:
    branches: [feat/v1]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust (fmt, clippy, drift, tests, doctests)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Installs the toolchain and components pinned in rust-toolchain.toml.
      - name: Install Rust toolchain
        run: rustup toolchain install --no-self-update && cargo --version
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/feat/v1' }}
      - uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2.90.5
        with:
          tool: cargo-nextest
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked --features runner/fake-provider -- -D warnings
      # Plan §5.1: the drift test regenerates schemas/agent and web/src/api/generated; nothing may change.
      # Skipped only while crates/contracts/src/lib.rs is the doc-comment stub; afterwards a missing test fails.
      - name: Contract drift (generated JSON Schemas and TS types)
        run: |
          if ! grep -qvE '^(//!.*)?$' crates/contracts/src/lib.rs; then
            echo "::notice title=Contract drift::crates/contracts is still a stub (plan §5.1); drift check skipped"
            exit 0
          fi
          UPDATE_GENERATED=1 cargo nextest run --workspace --locked --features runner/fake-provider \
            --no-tests=fail -E 'test(generated_artifacts_are_current)'
          if [ -n "$(git status --porcelain)" ]; then
            git status --short
            git diff
            echo "::error title=Contract drift::generated artefacts are stale; run the drift test with UPDATE_GENERATED=1 and commit the result"
            exit 1
          fi
      - name: Tests
        run: cargo nextest run --workspace --locked --features runner/fake-provider --no-fail-fast
      - name: Doctests
        run: cargo test --workspace --locked --features runner/fake-provider --doc
      - name: Working tree unchanged by build and tests
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git status --short
            echo "::error::the build or the tests changed tracked or untracked files"
            exit 1
          fi

  checks:
    name: Architecture and wording checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # check-architecture.sh reads `cargo metadata --no-deps`.
      - name: Install Rust toolchain
        run: rustup toolchain install --no-self-update && cargo --version
      # nullglob: tools/ or deploy/ may hold no script (or not exist).
      - name: Shellcheck
        run: |
          shopt -s globstar nullglob
          shellcheck scripts/*.sh tools/**/*.sh deploy/**/*.sh
      # Script tests (schema-smoke archive must not follow symlinks). Python libraries come from apt
      # (project policy: no pip).
      - name: Install Python test dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends python3-pytest python3-jsonschema sqlite3
      - name: Script tests
        run: python3 -m pytest -q scripts/tests
      - name: Backup script self-test (online snapshot under a live writer, restore)
        run: deploy/backup.sh --self-test
      - name: Architecture check self-test
        run: scripts/check-architecture.sh --self-test
      - name: Architecture check
        run: scripts/check-architecture.sh
      # Applied migrations are immutable (the server verifies their checksums at start).
      - name: Migrations unchanged
        run: |
          scripts/check-migrations.sh --self-test
          scripts/check-migrations.sh
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: web/package-lock.json
      # The wording checker loads the TypeScript 6 compiler API from web/node_modules (ADR-012); self-tested on
      # every run, so a broken checker cannot pass silently.
      - name: Install web dependencies for the wording check
        working-directory: web
        run: npm ci
      - name: Wording check self-test
        run: scripts/check-wording.sh --self-test
      - name: Wording check
        run: scripts/check-wording.sh

  # Images are built, never pushed. Plain `docker build` (BuildKit, docker driver): the runner and server builds
  # share the cargo cache mounts within the job; apt, Codex and node layers come from the runner's layer cache.
  images:
    name: Images (server, runner, egress proxy) and container tests
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    permissions:
      contents: read
    env:
      DOCKER_BUILDKIT: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: No development or test switch in the production files
        run: |
          deploy/check-production-config.sh --self-test
          deploy/check-production-config.sh
      - name: Build the egress proxy image
        run: docker build -t diffpilot-egress-proxy:local deploy/egress-proxy
      - name: Egress proxy test (SSRF guard, MemCan exception, no request data in logs)
        run: PROXY_SKIP_BUILD=1 deploy/egress-proxy/test.sh "$RUNNER_TEMP/egress-proxy-test.log"
      # Builds the runner image (targets base and runner) and the test image; the real-Codex job needs a login and
      # is skipped (the suite prints the skip).
      - name: Runner container suite (Rust supervisor, production image checks)
        env:
          R1_SUPERVISOR: rust
          R1_SKIP_CODEX: "1"
        run: deploy/runner/r1-test/run.sh "$RUNNER_TEMP/r1-test.log"
      - name: Build the server image
        run: docker build -f deploy/server/Dockerfile -t diffpilot-server:local .
      - name: Server image answers its healthcheck
        run: |
          key="$(mktemp)"
          echo placeholder > "$key"
          chmod 0444 "$key"
          docker run -d --name sr-ci-server --read-only --cap-drop ALL --security-opt no-new-privileges \
            --tmpfs /tmp -v "$key:/run/secrets/github-app.pem:ro" \
            -e SR_PUBLIC_URL=http://localhost:3000 -e SR_SECRET_KEY="$(head -c 32 /dev/urandom | base64)" \
            -e SR_RUNNER_SECRET=ci-runner-secret -e SR_GITHUB_APP_ID=1 -e SR_GITHUB_CLIENT_ID=ci \
            -e SR_GITHUB_CLIENT_SECRET=ci -e SR_GITHUB_APP_PRIVATE_KEY_FILE=/run/secrets/github-app.pem \
            -e SR_MEMCAN_URL=http://127.0.0.1:9/mcp -e SR_MEMCAN_TOKEN=ci \
            --mount type=volume,target=/var/lib/diffpilot diffpilot-server:local
          for _ in $(seq 60); do
            status="$(docker inspect -f '{{.State.Health.Status}}' sr-ci-server)"
            [ "$status" = healthy ] && break
            sleep 2
          done
          docker logs sr-ci-server
          docker exec sr-ci-server id
          [ "$status" = healthy ]
      # Needs Docker Engine 28.0+ (isolated runner network).
      - name: Stack test (runner reaches only the proxy and its listener; limits)
        run: |
          docker version -f 'Docker Engine {{.Server.Version}}'
          deploy/test-stack.sh "$RUNNER_TEMP/stack-test.log"
      - name: Remove test containers
        if: always()
        run: docker rm -f -v sr-ci-server || true

  web:
    name: Web (lint, tests, build, Playwright)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: No web project yet
        if: hashFiles('web/package.json') == ''
        run: echo "::notice title=Web::web/package.json does not exist yet; web jobs skipped"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: hashFiles('web/package.json') != ''
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        if: hashFiles('web/package.json') != ''
        working-directory: web
        run: npm ci
      - name: Lint
        if: hashFiles('web/package.json') != ''
        working-directory: web
        run: npm run lint
      - name: Tests
        if: hashFiles('web/package.json') != ''
        working-directory: web
        run: npm test
      - name: Build
        if: hashFiles('web/package.json') != ''
        working-directory: web
        run: npm run build
      - name: Install Playwright browser
        if: hashFiles('web/package.json') != ''
        working-directory: web
        run: npx playwright install --with-deps chromium
      - name: Playwright
        if: hashFiles('web/package.json') != ''
        working-directory: web
        run: npm run test:e2e

  # Full-stack journeys (e2e/README.md): built once, then every spec file starts its own dev stack
  # (deploy/dev/stack.sh: server, runner with the scripted fake provider, fake GitHub, fake MemCan) on free ports.
  # Not compose and no images. Two Playwright workers; traces and the stacks' logs are kept on failure.
  e2e:
    name: Full-stack e2e (dev stack, Playwright)
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        run: rustup toolchain install --no-self-update && cargo --version
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/feat/v1' }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            e2e/package-lock.json
      # stack.sh needs curl, git, openssl, python3 and sqlite3; the journeys read the database with sqlite3. Stack
      # state and the checks' scratch live under /data/tmp (host convention, stack.sh and stack-check.sh).
      - name: Install stack tools and the scratch directory
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends sqlite3
          sudo install -d -o "$(id -u)" -g "$(id -g)" /data/tmp
      - name: Build the web UI
        working-directory: web
        run: |
          npm ci
          npm run build
      # The binaries every stack runs, built once and handed to stack.sh and the global setup (SR_DEV_*_BIN).
      - name: Build the server (embedded UI), the runner (fake provider) and the fakes
        run: |
          cargo build --locked --message-format=json-render-diagnostics \
            -p server --features server/embed-ui -p runner --features runner/fake-provider \
            -p fake-github -p fake-memcan > "$RUNNER_TEMP/cargo-messages.json"
          for pair in SR_DEV_SERVER_BIN=diffpilot-server SR_DEV_RUNNER_BIN=diffpilot-runner \
            SR_DEV_FAKE_GITHUB_BIN=fake-github SR_DEV_FAKE_MEMCAN_BIN=fake-memcan; do
            bin="$(jq -r --arg name "${pair#*=}" \
              'select(.reason == "compiler-artifact" and .target.name == $name) | .executable // empty' \
              "$RUNNER_TEMP/cargo-messages.json" | tail -n 1)"
            [ -x "$bin" ] || { echo "::error::cargo built no executable ${pair#*=}"; exit 1; }
            echo "${pair%%=*}=$bin" >> "$GITHUB_ENV"
          done
      - name: Install e2e dependencies and the browser
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Dev stack checks (git isolation, state dir, build timeouts, killed worker)
        timeout-minutes: 10
        run: deploy/dev/stack-check.sh
      - name: Full-stack journeys
        timeout-minutes: 40
        working-directory: e2e
        run: npx playwright test --workers=2
      # Only the logs/ of each stack: stack.env and the App key next to them are secrets (fake, but never uploaded).
      - name: Collect the stacks' logs
        if: failure()
        run: |
          mkdir -p "$RUNNER_TEMP/stack-logs"
          for dir in /data/tmp/diffpilot-dev.*/logs; do
            [ -d "$dir" ] && cp -r "$dir" "$RUNNER_TEMP/stack-logs/$(basename "$(dirname "$dir")")"
          done
      - name: Upload Playwright traces and stack logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-failure
          path: |
            e2e/test-results
            ${{ runner.temp }}/stack-logs
          retention-days: 7
          if-no-files-found: warn
